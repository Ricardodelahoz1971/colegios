<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VITRINA DE PILDORITAS ÉLITE</title>
    <link rel="stylesheet" href="../styles/modules/ui_kit.css">
    <style>
        :root {
            --el-primary: #0a044d;
            --el-primary-rgb: 10, 4, 77;
            --el-accent: #ffb800;
            --el-accent-rgb: 255, 184, 0;
            --el-success: #10b981;
            --el-success-rgb: 16, 185, 129;
            --el-danger: #ef4444;
            --el-danger-rgb: 239, 68, 68;
            --el-warning: #f59e0b;
            --el-warning-rgb: 245, 158, 11;
            --el-info: #0ea5e9;
            --el-info-rgb: 14, 165, 233;
            --el-white: #ffffff;
            --el-bg: #f8fafc;
            --el-transition-fast: 0.2s ease;
        }
        body { 
            background: var(--el-bg); 
            padding: 50px; 
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }
        h2 { font-weight: 900; color: var(--el-primary); letter-spacing: -1px; margin-bottom: 0; }
    </style>
</head>
<body>
    <h2>PILDORITAS ÉLITE (VITRINA 06)</h2>
    <div class="container">
        <span class="badge-elite badge-elite--primary">Primario</span>
        <span class="badge-elite badge-elite--accent">Acento</span>
        <span class="badge-elite badge-elite--success">Éxito / Activo</span>
        <span class="badge-elite badge-elite--danger">Peligro / Error</span>
        <span class="badge-elite badge-elite--warning">Advertencia</span>
        <span class="badge-elite badge-elite--info">Información</span>
    </div>

    <div class="container" style="background: #0a044d;">
        <span class="badge-elite badge-elite--primary" style="background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.2);">Modo Oscuro</span>
        <span class="badge-elite badge-elite--accent">Acento Glow</span>
        <span class="badge-elite badge-elite--success">Éxito Glass</span>
    </div>
</body>
</html>
